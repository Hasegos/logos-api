<th:block th:fragment="head(pageTitle, pageDescription, canonicalUrl, pageCssPath, ogImage, ogType)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="naver-site-verification" content="9aa1d0e2573451ab28cbf8329a797e445c6b622f">
    <meta name="google-adsense-account" content="ca-pub-7175719893208123">

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7175719893208123"
            crossorigin="anonymous"></script>

    <!-- SEO -->
    <meta name="description" th:content="${pageDescription}">

    <!-- Canonical -->
    <link rel="canonical" th:href="${canonicalUrl}">

    <!-- OG -->
    <meta property="og:site_name" content="Logos API">
    <meta property="og:type" th:content="${ogType} ?: 'website'">
    <meta property="og:title" th:content="${pageTitle}">
    <meta property="og:description" th:content="${pageDescription}">
    <meta property="og:url" th:content="${canonicalUrl}">
    <meta property="og:image" th:content="${ogImage} ?: 'https://logos-api.com/img/og_image.png'">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" th:content="${pageTitle}">
    <meta name="twitter:description" th:content="${pageDescription}">
    <meta name="twitter:image" th:content="${ogImage} ?: 'https://logos-api.com/img/og_image.png'">

    <title th:text="${pageTitle}">Logos API</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="apple-touch-icon" th:href="@{/img/favicon.svg}">

    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{${pageCssPath}}">
</th:block>
