<th:block th:fragment="head(pageTitle, pageDescription, canonicalUrl, pageCssPath)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="keywords" content="성경 API, Bible API, 성경 구절, 개역개정, 무료 API">
    <meta name="description" th:content="${pageDescription}">

    <!-- Canonical -->
    <link rel="canonical" th:href="${canonicalUrl}">

    <!-- OG -->
    <meta property="og:site_name"    content="Logos API">
    <meta property="og:type"         content="website">
    <meta property="og:title"        th:content="${pageTitle}">
    <meta property="og:description"  th:content="${pageDescription}">
    <meta property="og:url"          th:content="${canonicalUrl}">
    <meta property="og:image"        content="https://logos-api.com/img/og_image.png">
    <meta property="og:image:width"  content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       th:content="${pageTitle}">
    <meta name="twitter:description" th:content="${pageDescription}">
    <meta name="twitter:image"       content="https://logos-api.com/img/og_image.png">

    <title th:text="${pageTitle}">Logos API</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="apple-touch-icon" th:href="@{/img/favicon.svg}">

    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{${pageCssPath}}">
</th:block>
