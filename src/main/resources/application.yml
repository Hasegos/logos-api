server:
  port: ${PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      force: true
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,application/javascript,application/json,application/xml,text/plain

spring:
  application:
    name: logos_api

  web:
    resources:
      cache:
        cachecontrol:
          max-age: 30d
          cache-public: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**

  jackson:
    serialization:
      indent-output: true
    default-property-inclusion: NON_NULL

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRESQL_DATABASE}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

springdoc:
  api-docs:
    path: /v3/api-docs
  # 브라우저로 열어 볼 때 읽히도록 줄바꿈해서 내려준다.
  writer-with-default-pretty-printer: true
  # -ui 아티팩트를 쓰지 않아 Swagger UI 는 없지만, 의존성이 바뀌어도 켜지지 않도록 막아 둔다.
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: logos-api

logging:
  level:
    root: INFO
    io.github.logos_api: INFO