server:
  port: ${PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      force: true
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,application/javascript,application/json,application/xml,text/plain

spring:
  application:
    name: logos_api

  web:
    resources:
      cache:
        cachecontrol:
          max-age: 30d
          cache-public: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**

  jackson:
    serialization:
      indent-output: true
    default-property-inclusion: NON_NULL

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRESQL_DATABASE}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: logos-api

logging:
  level:
    root: INFO
    io.github.logos_api: DEBUG
    org.hibernate.SQL: DEBUG